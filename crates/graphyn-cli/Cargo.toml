[package]
name = "graphyn-cli"
description = "Developer CLI for Graphyn — analyze, query, watch, and serve code intelligence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[[bin]]
name = "graphyn"
path = "src/main.rs"

[features]
# The languages a default binary carries. `--no-default-features --features
# python` builds a Python-only `graphyn`; `full` is the published everything
# binary, and is the same set until Tier 2 languages land.
default = ["typescript", "python", "rust", "go", "c"]
full = ["default", "java"]
typescript = ["graphyn-lang/typescript", "graphyn-mcp/typescript"]
python = ["graphyn-lang/python", "graphyn-mcp/python"]
rust = ["graphyn-lang/rust", "graphyn-mcp/rust"]
go = ["graphyn-lang/go", "graphyn-mcp/go"]
c = ["graphyn-lang/c", "graphyn-mcp/c"]
java = ["graphyn-lang/java", "graphyn-mcp/java"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
graphyn-core = { path = "../graphyn-core", version = "0.2.0" }
graphyn-lang = { path = "../graphyn-lang", version = "0.2.0", default-features = false }
graphyn-store = { path = "../graphyn-store", version = "0.2.0" }
graphyn-mcp = { path = "../graphyn-mcp", version = "0.2.0", default-features = false }

[dev-dependencies]
walkdir = "2"
serde_json = "1"
